[package]
name = "komorebi-server"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "komorebi_server-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[workspace]
members = [".", "migration"]

[workspace.dependencies]
loco-rs = { version = "1.1" }
ts-rs = { version = "12" }

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "process",
  "io-util",
] }
axum = "0.8"
tracing = { version = "0.1" }
regex = { version = "1.13" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
  "with-uuid",
  "debug-print",
] }
chrono = { version = "0.4", features = ["now"] }
# validator = { version = "0.20" }
uuid = { version = "1.26", features = ["v7", "std", "serde"] }

# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { workspace = true, features = [
  "chrono-impl",
  "serde-compat",
  "uuid-impl",
  "serde-json-impl",
  "indexmap-impl",
] }

# include_dir = { version = "0.7" }
reqwest = { version = "0.13.4", features = ["query", "json", "form"] }
yaml_serde = "0.10.7"
indexmap = { version = "2.14.1", features = ["serde"] }
scraper = "0.27.0"
strum = { version = "0.28", features = ["derive"] }
anitomy = { git = "https://github.com/Rapptz/anitomy-rs"}
tokio-util = "0.7.19"
librqbit = "9.0.1"
dashmap = "6.2.1"
futures = "0.3.34"
rayon = "1.12.0"
url = "2.5.8"
async-stream = "0.3.6"
tower-http = { version = "0.7.1", features = ["fs"] }
phf = { version = "0.14.0", features = ["macros"] }
which = "8.0.6"
walkdir = "2.5.0"
ffprobe = "0.4.0"
cached = { version = "3.1.1", features = ["async"] }

[[bin]]
name = "komorebi_server-cli"
path = "src/bin/main.rs"
required-features = []
[[bin]]
name = "tool"
path = "src/bin/tool.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.5.0" }
rstest = { version = "0.25" }
insta = { version = "1.48", features = ["redactions", "yaml", "filters"] }
ts-rs = { workspace = true, features = ["format"] }

[build-dependencies]
dotenv-build = "0.1.1"
ffmpeg-sidecar = "2.5.2"
which = "8.0.6"
walkdir = "2.5.0"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
