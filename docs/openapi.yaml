openapi: 3.1.0
info:
  title: Komorebi Server API
  description: |
    Unified media backend REST API and real-time Server-Sent Events (SSE) server for aggregating, synchronizing, and managing anime and manga media lists (MyAnimeList, AniList), scraping torrent indexes, managing multi-backend downloads (Direct HTTP with Range resume & BitTorrent/Magnet via librqbit), and providing an automated FFmpeg media transcoding, stream extraction, and range-compatible video streaming pipeline.
  version: 1.1.0

servers:
  - url: http://localhost:5150/api/v1
    description: Development API Server (default port)
  - url: /api/v1
    description: Relative API Base Path

tags:
  - name: Media
    description: Media list synchronization and normalization across MAL and AniList
  - name: User
    description: User authentication, registration, profile management, and OAuth token exchange
  - name: Crawler
    description: Web scraping and torrent index search with Anitomy title parsing
  - name: Vault
    description: Local media file acquisition, Server-Sent Events (SSE), metadata, and video streaming
  - name: System
    description: Application health, connectivity, and readiness probes

paths:
  /_health:
    get:
      servers:
        - url: http://localhost:5150
        - url: /
      summary: Health Check
      description: Returns the overall operational health status of the Loco application.
      operationId: getHealth
      tags:
        - System
      responses:
        "200":
          description: Application is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /_ping:
    get:
      servers:
        - url: http://localhost:5150
        - url: /
      summary: Ping Probe
      description: Simple ping endpoint for connectivity verification and keep-alive checks.
      operationId: getPing
      tags:
        - System
      responses:
        "200":
          description: Pong response.
          content:
            text/plain:
              schema:
                type: string
                example: "pong"

  /_readiness:
    get:
      servers:
        - url: http://localhost:5150
        - url: /
      summary: Readiness Check
      description: Verifies that the server, database connection pool, and workers are ready to accept requests.
      operationId: getReadiness
      tags:
        - System
      responses:
        "200":
          description: Server is ready to receive traffic.
          content:
            text/plain:
              schema:
                type: string
                example: "OK"
        "500":
          description: Server or database is not ready.
          content:
            text/plain:
              schema:
                type: string
                example: "ERROR"
  /media/anime:
    post:
      summary: Get User Anime List
      description: Retrieves the paginated anime list for a given user from their linked third-party provider (MAL or AniList).
      operationId: getUserAnimeList
      tags:
        - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaClientParams"
      responses:
        "200":
          description: Successfully retrieved user anime list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMediaResponse"
        "400":
          description: Failed to fetch anime list or invalid input parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "404":
          description: User not found in database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "500":
          description: Internal server or upstream provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /media/manga:
    post:
      summary: Get User Manga List
      description: Retrieves the paginated manga list for a given user from their linked third-party provider (MAL or AniList).
      operationId: getUserMangaList
      tags:
        - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaClientParams"
      responses:
        "200":
          description: Successfully retrieved user manga list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMediaResponse"
        "400":
          description: Failed to fetch manga list or invalid input parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "404":
          description: User not found in database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "500":
          description: Internal server or upstream provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/login:
    post:
      summary: Authenticate User
      description: Finds a user by username, provider, and sandbox flag, then verifies their optional Argon2 passcode.
      operationId: loginUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginParams"
      responses:
        "200":
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "401":
          description: User not found or invalid passcode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/add:
    post:
      summary: Add / Save User
      description: |
        Creates a new user or updates an existing user record.
        The user is validated against the upstream provider before saving:
        If `access_token` is provided, provider user details (username, avatar) are fetched;
        otherwise the username is validated by attempting a public list probe (sandbox mode).
      operationId: saveUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: User saved/upserted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveUserResponse"
        "400":
          description: Invalid input parameters or failed provider validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/all:
    post:
      summary: Get All Users
      description: Retrieves all registered users from the database.
      operationId: getAllUsers
      tags:
        - User
      responses:
        "200":
          description: Successfully retrieved all users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/one:
    post:
      summary: Get User By ID
      description: Retrieves a single registered user by UUID.
      operationId: getUserById
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetUserParams"
      responses:
        "200":
          description: Successfully retrieved user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUserResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/delete:
    post:
      summary: Delete User
      description: Deletes a user account from the database by UUID (cascades to user's vault items).
      operationId: deleteUser
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteUserParams"
      responses:
        "200":
          description: User deleted successfully. Returns the UUID of the deleted user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteUserResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /user/oauth/exchange:
    post:
      summary: Exchange OAuth Authorization Code
      description: Exchanges an OAuth authorization code and PKCE code verifier for an access token from the provider.
      operationId: exchangeOauthToken
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeOauthTokenParams"
      responses:
        "200":
          description: Access token successfully exchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthTokenResponse"
        "400":
          description: Invalid authorization code or missing parameters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "502":
          description: Upstream provider OAuth error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /crawler/search:
    post:
      summary: Search Media Crawlers
      description: Scrapes configured active external sites (e.g. Nyaa.si) for a query string and parses release titles using Anitomy.
      operationId: searchMediaCrawler
      tags:
        - Crawler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchMediaParam"
      responses:
        "200":
          description: Search completed successfully. Returns list of parsed crawler results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlerSearchResponse"
        "500":
          description: Crawler failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/add:
    post:
      summary: Add Download Item to Vault
      description: Creates a new Vault item, assigns isolated storage `{VAULT_LOC}/{vault_id}/`, dispatches to the download engine (Direct or Torrent), and wakes the background polling daemon.
      operationId: addVaultItem
      tags:
        - Vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultAddPayload"
      responses:
        "200":
          description: Download added and queued successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItemResponse"
        "400":
          description: Invalid input or unsupported download scheme.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "500":
          description: Download engine failed to add item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/all:
    get:
      summary: Stream All Vault Items (SSE)
      description: Returns a continuous Server-Sent Events (SSE) stream periodically yielding the complete list of vault records and active download/transcoding progress (`AppEvent::VaultItems`).
      operationId: streamAllVaultItems
      tags:
        - Vault
      responses:
        "200":
          description: Real-time Server-Sent Events stream emitting serialized AppEvent frames.
          content:
            text/event-stream:
              schema:
                type: string
                description: Continuous stream of SSE event lines containing AppEvent JSON.

  /vault/pause:
    post:
      summary: Pause Download
      description: Pauses an active direct HTTP or torrent download.
      operationId: pauseVaultDownload
      tags:
        - Vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultActionPayload"
      responses:
        "200":
          description: Download paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultActionResponse"
        "404":
          description: Vault item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/resume:
    post:
      summary: Resume Download
      description: Resumes a paused download from its existing byte offset on disk.
      operationId: resumeVaultDownload
      tags:
        - Vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultActionPayload"
      responses:
        "200":
          description: Download resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultActionResponse"
        "404":
          description: Vault item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/delete:
    post:
      summary: Delete / Cancel Download
      description: Stops active download, removes tracked handles, and deletes downloaded files and directory from disk.
      operationId: deleteVaultItem
      tags:
        - Vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultActionPayload"
      responses:
        "200":
          description: Download cancelled and deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultActionResponse"
        "404":
          description: Vault item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/metadata:
    post:
      summary: Batch Fetch Vault Sub-Item Metadata
      description: Queries relational media metadata (audio tracks, video subtitles, chapters, and fonts) for each sub-item belonging to the requested vault IDs.
      operationId: getVaultMetadata
      tags:
        - Vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSubItemPayload"
      responses:
        "200":
          description: Map of Vault ID to array of VaultSubItemDto records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultMetadataResponse"
        "500":
          description: Database or loader error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

  /vault/stream/{path}:
    get:
      summary: Stream Vault Media or Auxiliary Asset
      description: Range-compatible streaming endpoint for media files, DASH manifests, extracted subtitles, and fonts within the vault. Validates that the requested path resides strictly inside the configured vault directory.
      operationId: streamVaultFile
      tags:
        - Vault
      parameters:
        - name: path
          in: path
          required: true
          description: Relative file path within the vault repository.
          schema:
            type: string
      responses:
        "200":
          description: Complete file payload stream.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/dash+xml:
              schema:
                type: string
        "206":
          description: Partial Content byte-range response for seekable media streaming.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          description: Access denied (requested file is not located inside the vault).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"
        "404":
          description: File not found on disk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailureResponse"

components:
  schemas:
    FailureResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Application error code.
          example: ERROR_VAULT_ADD
        description:
          type:
            - string
            - "null"
          description: Human-readable error description.
          example: Download engine not found for this item

    MediaProvider:
      type: string
      enum:
        - MAL
        - ANILIST
      default: MAL
      description: Supported third-party media providers.

    MediaType:
      type: string
      enum:
        - Anime
        - Manga
        - Novel
      default: Anime
      description: Type of media.

    MediaFormat:
      type: string
      enum:
        - Unknown
        - Tv
        - TvShort
        - Movie
        - Special
        - Ova
        - Ona
        - Music
        - Manga
        - Novel
        - OneShot
        - Doujinshi
        - Manhwa
        - Manhua
        - Oel
      default: Unknown
      description: Format/medium of media release.

    ReleaseStatus:
      type: string
      enum:
        - Unknown
        - Releasing
        - Finished
        - NotYetReleased
        - Cancelled
        - Hiatus
      default: Unknown
      description: Airing or publication status of the media itself.

    ListStatus:
      type: string
      enum:
        - Current
        - Planning
        - Completed
        - Dropped
        - Paused
        - Repeating
      default: Current
      description: User's personal watch/read status.

    NsfwLevel:
      type: string
      enum:
        - Safe
        - Gray
        - Nsfw
      default: Safe
      description: Content maturity rating.

    MediaTitle:
      type: object
      properties:
        romanized:
          type:
            - string
            - "null"
          description: Romanized title (e.g. Romaji).
          example: Shingeki no Kyojin
        english:
          type:
            - string
            - "null"
          description: English localized title.
          example: Attack on Titan
        native:
          type:
            - string
            - "null"
          description: Native language title.
          example: "進撃の巨人"
        user_preferred:
          type:
            - string
            - "null"
          description: User preferred title choice.
          example: Attack on Titan

    CoverImage:
      type: object
      properties:
        extra_large:
          type:
            - string
            - "null"
          description: High-resolution cover image URL.
        large:
          type:
            - string
            - "null"
          description: Large cover image URL.
        medium:
          type:
            - string
            - "null"
          description: Medium cover image URL.
        color:
          type:
            - string
            - "null"
          description: Hex color code associated with cover image.
          example: "#e4a15d"

    Media:
      type: object
      required:
        - id
        - provider_id
        - provider
        - media_type
        - format
        - release_status
        - title
        - cover
        - genres
        - nsfw
      properties:
        id:
          type: string
          format: uuid
          description: Unique internal ID (UUID v7).
        provider_id:
          type: string
          description: External provider ID.
          example: "16498"
        provider:
          $ref: "#/components/schemas/MediaProvider"
        media_type:
          $ref: "#/components/schemas/MediaType"
        format:
          $ref: "#/components/schemas/MediaFormat"
        release_status:
          $ref: "#/components/schemas/ReleaseStatus"
        title:
          $ref: "#/components/schemas/MediaTitle"
        cover:
          $ref: "#/components/schemas/CoverImage"
        synopsis:
          type:
            - string
            - "null"
          description: Synopsis or summary of the media.
        mean_score:
          type:
            - number
            - "null"
          format: float
          description: Normalized community mean score (0.0 to 10.0 scale).
          example: 8.54
        popularity:
          type:
            - integer
            - "null"
          description: Total user popularity count.
          example: 2500000
        episodes:
          type:
            - integer
            - "null"
          description: Total episode count (anime only).
          example: 25
        duration:
          type:
            - integer
            - "null"
          description: Episode duration in seconds (anime only).
          example: 1440
        chapters:
          type:
            - integer
            - "null"
          description: Total chapter count (manga only).
        volumes:
          type:
            - integer
            - "null"
          description: Total volume count (manga only).
        genres:
          type: array
          items:
            type: string
          example: ["Action", "Drama", "Fantasy"]
        nsfw:
          $ref: "#/components/schemas/NsfwLevel"

    ListEntry:
      type: object
      required:
        - status
        - is_repeating
        - tags
      properties:
        status:
          $ref: "#/components/schemas/ListStatus"
        score:
          type:
            - number
            - "null"
          format: float
          description: User score normalized on a 0.0 to 10.0 scale.
          example: 9.0
        progress:
          type:
            - integer
            - "null"
          description: Episodes watched (anime) or chapters read (manga).
          example: 25
        progress_volumes:
          type:
            - integer
            - "null"
          description: Volumes read (manga only).
        is_repeating:
          type: boolean
          description: Whether the user is currently re-watching or re-reading.
          example: false
        repeat_count:
          type:
            - integer
            - "null"
          description: Number of times re-watched or re-read.
          example: 0
        tags:
          type: array
          items:
            type: string
          example: ["favorite", "masterpiece"]
        notes:
          type:
            - string
            - "null"
          description: Personal user notes/comments.
        updated_at:
          type:
            - string
            - "null"
          description: ISO timestamp of last entry update.

    MediaEntry:
      type: object
      required:
        - media
        - list_entry
      properties:
        media:
          $ref: "#/components/schemas/Media"
        list_entry:
          $ref: "#/components/schemas/ListEntry"

    Paging:
      type: object
      required:
        - has_next
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: Cursor for fetching the next page.
        prev_cursor:
          type:
            - string
            - "null"
          description: Cursor for fetching the previous page.
        has_next:
          type: boolean
          description: Indicates whether another page of results exists.
          example: true

    PaginatedResponse:
      type: object
      required:
        - data
        - paging
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MediaEntry"
        paging:
          $ref: "#/components/schemas/Paging"

    PaginatedMediaResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/PaginatedResponse"

    MediaClientParams:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique identifier (UUID) of the user.
        status:
          type:
            - string
            - "null"
          description: Filter by list status.
        sort:
          type:
            - string
            - "null"
          example: score_desc
        limit:
          type:
            - integer
            - "null"
          default: 50
          example: 20
        offset:
          type:
            - integer
            - "null"
          default: 0
          example: 0

    User:
      type: object
      required:
        - id
        - username
        - provider
        - is_sandbox
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique user ID (UUID v7).
        username:
          type: string
          description: Provider username or handle.
          example: octocat
        provider_id:
          type:
            - string
            - "null"
          description: Provider-specific user ID.
        avatar_url:
          type:
            - string
            - "null"
          description: Profile avatar image URL.
        provider:
          $ref: "#/components/schemas/MediaProvider"
        is_sandbox:
          type: boolean
          description: Sandbox status (true if no access token is set).
        access_token:
          type:
            - string
            - "null"
          description: OAuth access token for provider API requests.
        passcode:
          type:
            - string
            - "null"
          description: Optional user passcode (Argon2 hashed or plaintext).
        created_at:
          type: string
          format: date-time
          description: Creation timestamp.
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp.

    LoginParams:
      type: object
      required:
        - username
        - provider
      properties:
        username:
          type: string
          example: octocat
        passcode:
          type:
            - string
            - "null"
          example: "mysecretpassword"
        provider:
          $ref: "#/components/schemas/MediaProvider"
        is_sandbox:
          type:
            - boolean
            - "null"
          default: false

    GetUserParams:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid

    DeleteUserParams:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid

    ExchangeOauthTokenParams:
      type: object
      required:
        - provider
        - code
        - code_verifier
      properties:
        provider:
          $ref: "#/components/schemas/MediaProvider"
        code:
          type: string
          description: Authorization code received from OAuth redirect callback.
        code_verifier:
          type: string
          description: PKCE code verifier.

    GetUserResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    SaveUserResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

