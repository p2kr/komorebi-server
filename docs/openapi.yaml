          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/VaultSubItemDto"

    AppEvent:
      type: object
      description: Server-Sent Event frame emitted over `/api/v1/vault/all`.
      oneOf:
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - Unknown
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              enum:
                - VaultItems
            data:
              type: array
              items:
                $ref: "#/components/schemas/VaultItem"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              enum:
                - VaultSubItems
            data:
              type: array
              items:
                $ref: "#/components/schemas/VaultSubItem"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              enum:
                - StreamingEvents
            data:
              $ref: "#/components/schemas/StreamingEvent"
        - type: object
          required:
            - type
            - data
          properties:
            type:
              type: string
              enum:
                - Error
            data:
              type: string
              description: Error message description.
      discriminator:
        propertyName: type

    StreamingEvent:
      oneOf:
        - type: object
          required:
            - Init
          properties:
            Init:
              type: object
              required:
                - vault_id
                - total
              properties:
                vault_id:
                  type: string
                  format: uuid
                total:
                  type: integer
        - type: object
          required:
            - Progress
          properties:
            Progress:
              type: object
              required:
                - sub_item_id
                - total_size
                - speed
                - progress
              properties:
                sub_item_id:
                  type: string
                  format: uuid
                total_size:
                  type: integer
                  format: int64
                speed:
                  type: integer
                  format: int64
                progress:
                  type: number
                  format: float
                eta_secs:
                  type:
                    - integer
                    - "null"
                  format: int64
        - type: object
          required:
            - Complete
          properties:
            Complete:
              type: object
              required:
                - sub_item_id
                - vault_id
                - is_last
              properties:
                sub_item_id:
                  type: string
                  format: uuid
                vault_id:
                  type: string
                  format: uuid
                is_last:
                  type: boolean

