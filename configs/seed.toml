# Komorebi Crawler Site Configurations
# This file contains the default scraper profiles used by the parallel web crawler.

# Template Variables:
# {query} - title of anime/manga + episode/chapter of anime/manga

[[crawler_config]]
key = "nyaa"
name = "Nyaa.si Anime Torrents"
url = "https://nyaa.si/?f=0&c=1_2&q={query}"
rowSelector = "table.torrent-list tbody tr"
titleSelector = "a[href^='/view/']:not(.comments)"
linkSelector = "a[href^='magnet:']"
popularitySelector = "td:nth-child(6)"
sizeSelector = "td:nth-child(4)"
isDeleted = false
category = "anime"

[[crawler_config]]
key = "animetosho"
name = "AnimeTosho Torrents"
url = "https://animetosho.org/search?q={query}"
rowSelector = "div.home_list_entry"
titleSelector = "div.link a"
linkSelector = "a[href^='magnet:']"
popularitySelector = "span.seeders, div.links"
sizeSelector = "div.size, span.size"
isDeleted = false
category = "anime"

[[crawler_config]]
key = "tokyotosho"
name = "Tokyo Toshokan"
url = "https://tokyotosho.info/search.php?terms={query}"
rowSelector = "table.listing tr.main"
titleSelector = "td.desc-top a:not([website])"
linkSelector = "a[href^='magnet:']"
popularitySelector = "td.stats-0"
sizeSelector = "td.desc-top"
isDeleted = true # Disabled: Server connection times out (522 Cloudflare Error)
category = "anime"

[[crawler_config]]
key = "subsplease"
name = "SubsPlease API"
url = "https://subsplease.org/api/?f=search&tz=UTC&s={query}"
rowSelector = "json"
titleSelector = "show"
linkSelector = "downloads"
# popularitySelector is null
sizeSelector = "filesize"
isDeleted = false
category = "anime"

[[crawler_config]]
key = "erairaws"
name = "Erai-raws RSS"
url = "https://www.erai-raws.info/rss-1080p/"
rowSelector = "item"
titleSelector = "title"
linkSelector = "link"
popularitySelector = "seeders, erai\\:seeders"
sizeSelector = "size, erai\\:size"
isDeleted = true # Disabled: Returns 403 Forbidden (Cloudflare anti-bot protection)
category = "anime"
